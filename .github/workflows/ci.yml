name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify starter
        run: pnpm example:check

      - name: Verify development server
        run: pnpm integration:development

      - name: Verify browser delivery
        run: pnpm integration:browser

      - name: Verify production server
        run: pnpm integration:production

      - name: Verify packages
        run: pnpm release:check

      - name: Verify packed installation
        run: pnpm release:install-check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
